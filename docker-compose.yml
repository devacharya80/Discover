services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: discover
      POSTGRES_USER: discover
      POSTGRES_PASSWORD: discover
    ports:
      - "5432:5432"
    volumes:
      - discover_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U discover -d discover"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://discover:discover@postgres:5432/discover?schema=public
      JWT_SECRET: change-me-in-production
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  discover_pg:
